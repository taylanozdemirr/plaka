<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Plaka Atelier — Aracınıza bir imza.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11141a"/>
      <stop offset="0.55" stop-color="#0a0b0e"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.82" cy="0.18" r="0.68">
      <stop offset="0" stop-color="#c9a86a" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#c9a86a" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#c9a86a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.08" cy="0.92" r="0.6">
      <stop offset="0" stop-color="#1c3f94" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1c3f94" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plateFace" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f6f3ea"/>
      <stop offset="0.52" stop-color="#ece7da"/>
      <stop offset="1" stop-color="#ddd5c3"/>
    </linearGradient>
    <linearGradient id="plateEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8d9b4"/>
      <stop offset="0.5" stop-color="#a9854a"/>
      <stop offset="1" stop-color="#e3ce9c"/>
    </linearGradient>
    <filter id="plateShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowGold)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>

  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 70h1200M0 140h1200M0 210h1200M0 280h1200M0 350h1200M0 420h1200M0 490h1200M0 560h1200"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M80 0v630M160 0v630M240 0v630M320 0v630M400 0v630M480 0v630M560 0v630M640 0v630M720 0v630M800 0v630M880 0v630M960 0v630M1040 0v630M1120 0v630"/>
  </g>

  <g transform="translate(462 292)" filter="url(#softGlow)" opacity="0.55">
    <ellipse cx="315" cy="35" rx="210" ry="42" fill="#c9a86a"/>
  </g>

  <!-- Plate -->
  <g filter="url(#plateShadow)" transform="rotate(-3 890 335)">
    <rect x="682" y="252" width="420" height="158" rx="15" fill="url(#plateEdge)"/>
    <rect x="686" y="256" width="412" height="150" rx="12" fill="url(#plateFace)"/>
    <rect x="686" y="256" width="412" height="150" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1"/>

    <!-- TR band -->
    <path d="M686 268a12 12 0 0 1 12-12h52v150h-52a12 12 0 0 1-12-12V268Z" fill="#173c86"/>
    <path d="M686 268a12 12 0 0 1 12-12h52v150h-52a12 12 0 0 1-12-12V268Z" fill="none" stroke="#0d2860" stroke-width="1"/>
    <text x="718" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="1.4" fill="#ffffff">TR</text>
    <path d="M710 340l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L710 340Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="733" cy="352" r="5.5" fill="#ffffff" opacity="0.95"/>

    <!-- Main characters -->
    <text x="900" y="343" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="3" fill="#17223d">06 PA 14</text>

    <!-- Rivets -->
    <g fill="#b9ae97">
      <circle cx="704" cy="274" r="3.2"/><circle cx="1080" cy="274" r="3.2"/>
      <circle cx="704" cy="388" r="3.2"/><circle cx="1080" cy="388" r="3.2"/>
    </g>
    <text x="1060" y="286" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2" fill="#7a7e88">PLAKA ATELIER</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(88 96)">
    <path d="M0 22h26" stroke="#c9a86a" stroke-width="1"/>
    <text x="40" y="27" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="6" fill="#e8e2d6">PLAKA ATELIER</text>
    <text x="40" y="47" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="600" letter-spacing="4.5" fill="#8b8d95">TÜRKİYE · EST. 2014</text>
  </g>

  <!-- Headline -->
  <g transform="translate(86 248)">
    <text font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="500" letter-spacing="-3.4" fill="#f3efe7">Aracınıza</text>
    <text y="90" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="82" letter-spacing="-2.6" fill="#d9bd8a">bir imza.</text>
    <text y="146" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#a3a5ad">Müze kalitesinde işçilikle üretilen</text>
    <text y="172" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#a3a5ad">normal, app ve koleksiyon plakalar.</text>
  </g>

  <!-- Footer -->
  <g transform="translate(88 548)">
    <path d="M0 0h520" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <text y="34" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#8b8d95">PLAKAATELIER.COM</text>
    <text x="520" y="34" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#c9a86a">81 İLE KARGO · 2 YIL GARANTİ</text>
  </g>
</svg>
